<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tableau de bord · État des lieux Greatly</title>
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="../assets/css/base.css?v=24">
<link rel="stylesheet" href="../assets/css/admin.css?v=24">
</head>
<body class="admin">

<main class="admin__page">

  <header class="admin__entete">
    <div class="admin__identite">
      <span class="admin__surtitre">Greatly · Tableau de bord</span>
      <h1 class="admin__titre serif">État des lieux d'équipe</h1>
    </div>
    <div class="admin__actions">
      <span class="badge badge--sable" data-badge hidden></span>
      <button class="bouton-secondaire" type="button" data-deconnexion hidden>Se déconnecter</button>
    </div>
  </header>

  <!-- Écran d'accès, masqué en mode démo. -->
  <section class="carte acces" data-acces hidden>
    <h2 class="acces__titre serif">Accès au tableau de bord</h2>
    <p class="acces__texte">Connectez-vous avec votre compte Google. Seules les adresses autorisées voient les réponses.</p>
    <div class="acces__google" data-bouton-google></div>
    <p class="message" data-message-acces role="alert" hidden></p>
  </section>

  <p class="admin__chargement" data-chargement role="status" hidden>Chargement des réponses…</p>

  <div data-tableau hidden>
    <div class="carte filtres" data-filtres></div>
    <div class="tuiles" data-indicateurs></div>
    <div class="sections" data-sections></div>
  </div>

</main>

<script src="https://accounts.google.com/gsi/client" async></script>
<script type="module" src="../assets/js/admin/tableau.js?v=24"></script>
</body>
</html>
