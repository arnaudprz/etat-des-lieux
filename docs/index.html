<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ce qui vous aide à bien travailler ensemble · Greatly</title>
<meta name="description" content="En 2 minutes, voyez ce qui fonctionne déjà entre vous et ce qui peut encore évoluer. Anonyme, aucun compte à créer, résultat immédiat.">

<!-- Aperçu des réseaux. L'image doit être un PNG en adresse absolue :
     LinkedIn, WhatsApp et Slack n'affichent pas les SVG et ne résolvent pas
     les chemins relatifs. L'adresse doit suivre celle du site, voir DEPLOY.md. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://arnaudprz.github.io/etat-des-lieux/">
<meta property="og:site_name" content="Greatly">
<meta property="og:title" content="Ce qui vous aide à bien travailler ensemble">
<meta property="og:description" content="Un état des lieux d'équipe en 2 minutes. Anonyme, aucun compte à créer, résultat immédiat.">
<meta property="og:image" content="https://arnaudprz.github.io/etat-des-lieux/assets/img/apercu-reseaux.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Quatre pousses, de la graine semée à l'arbre bien enraciné">
<meta property="og:locale" content="fr_FR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ce qui vous aide à bien travailler ensemble">
<meta name="twitter:description" content="Un état des lieux d'équipe en 2 minutes. Anonyme, aucun compte à créer, résultat immédiat.">
<meta name="twitter:image" content="https://arnaudprz.github.io/etat-des-lieux/assets/img/apercu-reseaux.png">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="assets/css/base.css?v=6">
<link rel="stylesheet" href="assets/css/parcours.css?v=6">
</head>
<body>

<div class="bandeau">
  <span class="bandeau__texte">
    <span class="bandeau__long">Un état des lieux proposé par Greatly, qui accompagne dirigeants, managers et équipes à la Greatly House, près de Lille</span>
    <span class="bandeau__court">Proposé par Greatly, près de Lille</span>
  </span>
  <a href="https://greatly.club"><span class="bandeau__long">Qui sommes-nous</span><span class="bandeau__court">En savoir plus</span></a>
</div>

<header class="entete">
  <span class="entete__marque">Greatly</span>
  <nav class="entete__nav" aria-label="Sections de la page">
    <a href="#dimensions">Les dimensions</a>
  </nav>
</header>

<main>

  <!-- 1. Le haut de page. -->
  <section class="hero">
    <div class="hero__texte">
      <span class="badge" data-badge></span>
      <h1 class="hero__titre" data-titre></h1>
      <p class="hero__intro" data-texte></p>
      <div class="hero__actions">
        <a class="btn" href="profil.html" data-bouton></a>
        <span class="compteur">
          <span class="compteur__point" aria-hidden="true"></span>
          <span><strong data-compteur>255</strong> <span data-compteur-texte></span></span>
        </span>
      </div>
      <p class="hero__mentions" data-mentions></p>
    </div>

    <!-- L'illustration est insérée en SVG par accueil.js : elle reste nette et
         n'ajoute aucune requête. Sur mobile, ses étiquettes internes laissent
         la place aux pastilles ci-dessous. -->
    <figure class="hero__illustration">
      <div data-pousses></div>
      <figcaption class="nuancier nuancier--mobile" data-nuancier></figcaption>
    </figure>
  </section>

  <!-- 2. Les deux « pourquoi ». -->
  <section class="pourquoi">
    <div class="carte pourquoi__carte">
      <span class="surtitre" data-pour-vous-surtitre></span>
      <h2 class="pourquoi__titre" data-pour-vous-titre></h2>
      <ul class="pourquoi__liste" data-pour-vous-lignes></ul>
    </div>

    <div class="carte pourquoi__carte pourquoi__carte--foret">
      <span class="surtitre surtitre--clair" data-pour-greatly-surtitre></span>
      <h2 class="pourquoi__titre" data-pour-greatly-titre></h2>
      <p class="pourquoi__texte" data-pour-greatly-texte></p>
      <p class="pourquoi__source" data-pour-greatly-source></p>
    </div>
  </section>

  <!-- 3. Ce que vous recevez. -->
  <section class="section section--blanche">
    <div class="recevez">
      <div class="recevez__texte">
        <span class="surtitre" data-resultat-surtitre></span>
        <h2 class="section__titre" data-resultat-titre></h2>
        <div class="recevez__points" data-points></div>
      </div>

      <div class="carte apercu">
        <div class="apercu__entete">
          <span class="apercu__titre" data-apercu-titre></span>
          <span class="apercu__mention" data-apercu-mention></span>
        </div>
        <div class="apercu__lignes" data-apercu></div>
        <div class="apercu__pied" data-apercu-pied></div>
      </div>
    </div>
  </section>

  <!-- Sur quoi repose l'état des lieux. -->
  <section class="section" id="dimensions">
    <div class="sources">
      <div class="sources__texte">
        <h2 class="section__titre" data-sources-titre></h2>
        <p data-sources-texte></p>
        <ul class="sources__liste" data-sources-liens></ul>
        <p class="mention" data-sources-mention></p>
      </div>
      <div class="dimensions" data-dimensions></div>
    </div>
  </section>

  <section class="appel">
    <a class="btn" href="profil.html" data-bouton></a>
  </section>

</main>

<footer class="pied">
  <span class="pied__marque">Greatly</span>
  <p><span data-pied></span> <a href="confidentialite.html">Politique de confidentialité</a></p>
</footer>

<script type="module" src="assets/js/parcours/accueil.js?v=6"></script>
</body>
</html>
